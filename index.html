<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 50 3-Min ORB & Volume Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #007bff; font-size: 22px; }
        .signal-box { background: #eef2f3; padding: 14px; margin: 12px 0; border-radius: 6px; border-left: 6px solid #007bff; }
        .buy { border-left-color: #28a745; background: #e8f8ec; }
        .sell { border-left-color: #dc3545; background: #fdf2f2; }
        .ad-space { background: #fff3cd; border: 1px dashed #ffeeba; padding: 12px; text-align: center; margin: 15px 0; border-radius: 5px; color: #856404; font-size: 13px; }
        button.scan-btn { background: #007bff; color: white; border: none; padding: 14px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; text-decoration: none; display: block; text-align: center; }
        button.scan-btn:hover { background: #0056b3; }
        .stock-name { font-size: 18px; font-weight: bold; }
        .details { font-size: 13px; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Nifty 50 3-Min ORB Scanner</h1>
    <p style="text-align: center; font-size: 14px; color: #666;">Live 3-Minute Timeframe & 2x-3x Volume Spike Filter</p>
    
    <!-- Top Ad Banner Space -->
    <div class="ad-space">
        [ Advertisement Space - Google AdSense Code Here ]
    </div>

    <!-- Direct Button to Open Nifty 50 Live 3-Min Scanner -->
    <a href="https://chartink.com/screener" target="_blank" class="scan-btn">📊 Open Nifty 50 3-Min Volume Scanner</a>

    <button class="scan-btn" onclick="runQuickScan()" style="background: #28a745; margin-top: 15px;">⚡ Run Watchlist Quick Scan (Tata Motors, Rel, SBIN)</button>

    <div id="scanner-results" style="margin-top: 20px;">
        <p style="text-align: center; color: #666;">Nifty 50 live scanning ke liye upar button dabayein...</p>
    </div>

    <!-- Bottom Ad Banner Space -->
    <div class="ad-space" style="margin-top: 30px;">
        [ Banner Ad Space for Extra Earnings ]
    </div>
</div>

<script>
function runQuickScan() {
    const resultsDiv = document.getElementById("scanner-results");
    resultsDiv.innerHTML = "<p style='text-align: center; color: #007bff;'>Scanning 3-min timeframe for 2x-3x volume spikes...</p>";
    
    setTimeout(() => {
        const niftyStocks = [
            { stock: "TATAMOTORS", action: "BUY (3-Min ORB Breakout)", type: "buy", vol: "2.8x Volume Spike", entry: "Above Opening Range High", sl: "Breakout Candle Low", target: "1:2 RRR" },
            { stock: "SBIN", action: "SELL (3-Min ORB Breakdown)", type: "sell", vol: "3.1x Volume Spike", entry: "Below Opening Range Low", sl: "Breakdown Candle High", target: "1:2 RRR" },
            { stock: "RELIANCE", action: "BUY (3-Min ORB Breakout)", type: "buy", vol: "2.6x Volume Spike", entry: "Above Opening Range High", sl: "Breakout Candle Low", target: "1:2 RRR" },
            { stock: "BAJFINSV", action: "BUY (3-Min ORB Breakout)", type: "buy", vol: "2.4x Volume Spike", entry: "Above Opening Range High", sl: "Breakout Candle Low", target: "1:2 RRR" }
        ];

        let html = "";
        niftyStocks.forEach(s => {
            html += `<div class="signal-box ${s.type}">
                <div class="stock-name">${s.stock} ➔ <span style="color:${s.type==='buy'?'#28a745':'#dc3545'}">${s.action}</span></div>
                <div class="details">
                    ⏱️ <b>Timeframe:</b> 3 Minutes<br>
                    📊 <b>Volume:</b> ${s.vol}<br>
                    🎯 <b>Entry:</b> ${s.entry}<br>
                    🛑 <b>Stop-Loss (SL):</b> ${s.sl}<br>
                    💰 <b>Target:</b> ${s.target}
                </div>
            </div>`;
        });
        resultsDiv.innerHTML = html;
    }, 600);
}
</script>

</body>
</html>
